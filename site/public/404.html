<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Page not found · Roga</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<style>
  :root {
    color-scheme: light dark;
    --paper: #faf6ee;
    --ink: #16150e;
    --accent: #b53d00;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #16150e;
      --ink: #f5f0e6;
      --accent: #f2702e;
    }
  }

  body {
    display: grid;
    place-content: center;
    min-height: 100dvh;
    margin: 0;
    padding: 1rem;
    background: var(--paper);
    color: var(--ink);
    font: 1.0625rem/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  h1 {
    margin: 0 0 0.25rem;
    font-size: 1.5rem;
  }

  p {
    margin: 0;
  }

  a {
    color: var(--accent);
  }
</style>
</head>
<body>
<main>
  <h1>Page not found.</h1>
  <p>Check the address or <a href="/">return to the home page</a>.</p>
