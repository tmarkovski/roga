name: Publish

# Makes a prerelease that the Release workflow made the latest release, so
# every installed copy is offered it, and points the Homebrew cask at it.
#
# Run it by hand once you've updated a real copy of Roga to the prerelease, as
# the Release workflow's summary describes. Starting it is the approval:
# running it without trying the prerelease defeats the point of it. Errol does
# this with a required reviewer on an environment, which GitHub doesn't
# enforce for a private repository without Enterprise.
#
#   gh workflow run publish.yml --repo tmarkovski/roga -f version=0.1.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish, like 0.1.0, with no v.
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  APP_NAME: Roga
  RELEASES_REPO: tmarkovski/roga-releases
  TAP_REPO: tmarkovski/homebrew-roga

jobs:
  publish:
    name: Publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      V: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check it's a prerelease
        run: |
          set -euo pipefail
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$V isn't a version like 1.2.3."
            exit 1
          fi
          PRERELEASE="$(gh release view "v$V" --repo "$RELEASES_REPO" --json isPrerelease --jq .isPrerelease)"
          if [[ "$PRERELEASE" != "true" ]]; then
            echo "::error::v$V in $RELEASES_REPO isn't a prerelease, so it's been published already."
            exit 1
          fi

      - name: Make the prerelease the latest release
        run: gh release edit "v$V" --repo "$RELEASES_REPO" --prerelease=false --latest

      - name: Update the Homebrew cask
        run: |
          set -euo pipefail
          gh release download "v$V" --repo "$RELEASES_REPO" --pattern "$APP_NAME-$V.zip" --dir "$RUNNER_TEMP"
          gh repo clone "$TAP_REPO" "$RUNNER_TEMP/tap" -- --depth 1
          uv run Scripts/release/release.py cask "$RUNNER_TEMP/$APP_NAME-$V.zip" --out "$RUNNER_TEMP/tap/Casks/roga.rb"
          cd "$RUNNER_TEMP/tap"
          git add Casks/roga.rb
          if git diff --cached --quiet; then
            echo "The cask already installs $V."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Roga $V"
          gh auth setup-git
          git push

      - name: Check the live feed
        run: |
          set -euo pipefail
          BUILD="$(unzip -p "$RUNNER_TEMP/$APP_NAME-$V.zip" "$APP_NAME.app/Contents/Info.plist" \
            | python3 -c 'import plistlib, sys; print(plistlib.load(sys.stdin.buffer)["CFBundleVersion"])')"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL https://roga.sh/appcast.xml | grep -q "<sparkle:version>$BUILD</sparkle:version>"; then
              echo "roga.sh/appcast.xml offers build $BUILD."
              exit 0
            fi
            sleep 10
          done
          echo "::error::roga.sh/appcast.xml doesn't offer build $BUILD yet."
          exit 1
