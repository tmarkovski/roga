name: Site

# Checks the landing page in site/, gives each pull request a preview, and deploys
# main to roga.sh (decision 22). It only runs when the site changes, on Linux, so
# it costs none of the macOS minutes that ci.yml is careful with.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/site.yml
  pull_request:
    paths:
      - site/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: 4.157.0
  HTML_VALIDATE_VERSION: 11.18.0
  WRANGLER_SEND_METRICS: false

defaults:
  run:
    working-directory: site

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npx --yes html-validate@$HTML_VALIDATE_VERSION public/*.html
      - run: node --check public/compare.js
      - run: npx --yes wrangler@$WRANGLER_VERSION deploy --dry-run

  preview:
    name: Preview
    # Secrets don't reach pull requests from forks.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Upload a preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.jsonl
          PR_NUMBER: ${{ github.event.number }}
        run: npx --yes wrangler@$WRANGLER_VERSION versions upload --preview-alias "pr-$PR_NUMBER"

      - name: Post its address on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.jsonl
          PR_NUMBER: ${{ github.event.number }}
        run: |
          url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "::error::Wrangler gave no preview address. Is a workers.dev subdomain registered on the account?"
            exit 1
          fi
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "Preview of the site: $url"

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Deploy to roga.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@$WRANGLER_VERSION deploy

      # The first deploy has to wait for Cloudflare to issue a certificate.
      - name: Check that roga.sh serves the page
        run: |
          curl --fail --silent --show-error --location --max-time 20 \
            --retry 20 --retry-delay 15 --retry-all-errors \
            --output "$RUNNER_TEMP/page.html" https://roga.sh/
          grep --quiet "Rather Opinionated Git App" "$RUNNER_TEMP/page.html"
