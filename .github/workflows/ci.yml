name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The JSON project format needs Xcode 27.2 (decision 11).
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  package:
    name: YagaKit with git ${{ matrix.git }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest git yaga supports (decision 8), built from source.
          - git: 2.44.0
            sha256: e358738dcb5b5ea340ce900a0015c03ae86e804e7ff64e47aa4631ddee681de3
          # The git that comes with the runner image, which is kept current.
          - git: newest
    steps:
      - uses: actions/checkout@v7

      - name: Restore git ${{ matrix.git }}
        if: matrix.git != 'newest'
        id: git-cache
        uses: actions/cache@v6
        with:
          path: ~/git-${{ matrix.git }}
          key: git-${{ matrix.git }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build git ${{ matrix.git }}
        if: matrix.git != 'newest' && steps.git-cache.outputs.cache-hit != 'true'
        run: Scripts/build-git.sh "${{ matrix.git }}" "${{ matrix.sha256 }}" "$HOME/git-${{ matrix.git }}"

      - name: Use git ${{ matrix.git }}
        if: matrix.git != 'newest'
        run: echo "$HOME/git-${{ matrix.git }}/bin" >> "$GITHUB_PATH"

      - run: git version
      - run: swift build --package-path YagaKit --build-tests
      - run: swift test --package-path YagaKit --skip-build

  app:
    name: App
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Build the app
        run: >
          xcodebuild build
          -project Yaga.xcodeproj
          -scheme Yaga
          -configuration Release
          -destination platform=macOS
          -derivedDataPath build/DerivedData
          -onlyUsePackageVersionsFromResolvedFile
